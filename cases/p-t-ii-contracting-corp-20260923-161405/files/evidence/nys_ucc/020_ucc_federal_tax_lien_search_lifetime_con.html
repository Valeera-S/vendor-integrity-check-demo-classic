	function validateonlynumbers(e) {
		var regex = new RegExp("^[a-zA-Z0-9-]+$")
		var key = String.fromCharCode(!e.charCode ? e.which : e.charCode);
		if (!regex.test(key)) {
			e.preventDefault();
			return false;
		}
	}

	// Filing type dropdown Filling based on Lien selection
	function PopulateUCCFilingTypeListBox(lienTypeId, ElementName) {
		$.ajax({
			type: "POST",
			url: '/UCCSearch/GetUCCFilingTypesSearch',
			async: false,
			data: {
				LienTypeId: lienTypeId
			},
			success: function (data) {
				data = jQuery.parseJSON(data);
				var lienTypeSelect = $("#" + ElementName), option = '';
                $(lienTypeSelect).empty();
                lienTypeSelect.append('<option value="">-- Select --</option>');
				for (var i = 0; i < data.length; i++) {
					option += "<option value='" + data[i].Key + "'>" + data[i].Value + "</option>"
				}
				lienTypeSelect.append(option);
				lienTypeSelect.select = 0
			},
			error: function (xhr) {
				errorDialog('Error at UCC Filing Type For Lien :' + xhr.responseText);
			}
		});
	}

	function PopulateUCCFilingActionListBox(uCCFilingTypeId, ElementName) {
		$.ajax({
			type: "POST",
			url: '/UCCSearch/GetUCCFilingActions',
			async: false,
			data: {
				UCCFilingTypeId: uCCFilingTypeId
			},
			success: function (data) {
				data = jQuery.parseJSON(data);
				var filingActionSelect = $("#" + ElementName), option = '';
                $(filingActionSelect).empty();

				for (var i = 0; i < data.length; i++) {
					option += "<option value='" + data[i].Key + "'>" + data[i].Value + "</option>"
				}
				filingActionSelect.append(option);
				filingActionSelect.select = 0;
				/*$("#ddlLienAction").val('0').trigger('click');*/

				//  the idea is, if the method gets value for the dropdown then show/hide it here.
				if (data.length <= 1) {
					// lets hide this drop down since it has no values.
					$('#divLienAction').hide();
				}
				else {
					// lets show this drop down since it has values.
                    $('#divLienAction').show();
                    $("#ddlLienAction").show();
				}
			},
			error: function (xhr) {
				errorDialog('Error at divLienAction :' + xhr.responseText);
			}
		});
	}

    function PopulateUCCActionTypeListBox(uCCFilingTypeId, ElementName) {
        $.ajax({
            type: "POST",
            url: '/UCCSearch/GetUCCActionTypes',
            async: false,
            data: {
                UCCFilingActionId: uCCFilingTypeId
            },
            success: function (data) {
                data = jQuery.parseJSON(data);
                var actionTypeSelect = $("#" + ElementName), option = '';
                $(actionTypeSelect).empty();
                for (var i = 0; i < data.length; i++) {
                    option += "<option value='" + data[i].Key + "'>" + data[i].Value + "</option>"
                }
                actionTypeSelect.append(option);
                actionTypeSelect.select = 0;

                //  the idea is, if the method gets value for the dropdown then show/hide it here.
                // Note the first record is usually the "--Select--" option which a null.
                if (data.length <= 1) {
                    // lets hide this drop down since it has no values.
                    $('#divLienActionType').hide();
                }
                else {
                    // lets show this drop down since it has no values.
                    $('#divLienActionType').show();
                }
            },
            error: function (xhr) {
                errorDialog('Error at UCCActionType :' + xhr.responseText);
            }
        });
    }

            document.querySelectorAll(".button").forEach(function (el) {

                let text = "";
                if (el.tagName === "INPUT") {
                    text = el.value?.trim().toLowerCase();
                } else {
                    text = el.innerText?.trim().toLowerCase();
                }
                if (text === "back" || text === "reset" || text === "clear" || text === "cancel" || text === "restart") {
                    el.style.background = "#2E6082";
                }
                else {
                    el.style.background = "#FD751C";
                }

            });
        }
        const observer = new MutationObserver(() => applyButtonStyles());
        observer.observe(document.body, { childList: true, subtree: true });
    }
</script>
